name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The SDK floor declared in pubspec.yaml, plus the current stable.
        sdk: ["3.11.0", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      # Only on stable: formatter output can differ between SDK versions, and
      # a floor-SDK reflow would fail the check without anything being wrong.
      - name: Verify formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      # This package is published, so a manifest problem should fail here
      # rather than at release time.
      - name: Validate the package
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run
